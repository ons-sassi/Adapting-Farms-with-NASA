<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant agricole - sous-titrage direct</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff}
  .wrap{max-width:820px;margin:auto;padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:#9aa}
  input,select{background:#1c1c1c;color:#fff;border:1px solid #333;border-radius:6px;padding:6px 8px;font-size:13px}
  input[type=number]{width:90px} #token{width:230px}
  button{border:0;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}
  #go{background:#e53935;color:#fff} #clr{background:#333;color:#fff}
  .cap{background:#151515;border-radius:12px;padding:18px 22px;min-height:120px;text-align:center}
  #ar{font-size:22px;color:#bbb;margin-bottom:10px;min-height:30px}
  #en{font-size:28px;line-height:1.3;font-weight:700}
  .box{margin-top:12px;background:#161616;border-radius:12px;padding:14px 18px}
  .box h3{margin:0 0 8px;font-size:13px;color:#9aa;font-weight:600}
  #answer{font-size:18px;line-height:1.4} li{margin:5px 0;font-size:15px} .warn{color:#ffb74d}
  #status{font-size:13px;color:#9aa;min-height:18px;margin-top:8px}
</style></head><body><div class="wrap">
  <div class="row">
    <label>Token <input id="token" type="password" placeholder="Bearer token (login)"></label>
    <label>Parcelle <input id="parcelle" type="number" min="1" placeholder="id"></label>
    <label>Culture précédente <input id="prev" size="8" placeholder="wheat"></label>
    <label>Azote réel (kg N/ha) <input id="nrate" type="number" min="0" placeholder="exemple"></label>
  </div>
  <div class="row">
    <label>Parole <select id="sr"><option>ar-TN</option><option>ar-SA</option><option>fr-FR</option></select></label>
    <label>Réponse <select id="lang"><option value="fr">français</option><option value="en">English</option></select></label>
    <label><input id="subs" type="checkbox" checked> sous-titres anglais</label>
    <label><input id="voice" type="checkbox" checked> réponse vocale (ElevenLabs)</label>
    <button id="go">Start</button><button id="clr">Effacer</button>
  </div>
  <div class="cap"><div id="ar" dir="rtl"></div><div id="en">Appuie sur Start et parle</div></div>
  <div class="box"><h3>Réponse de l'assistant</h3><div id="answer">-</div><ul id="figures"></ul><ul id="gaps"></ul></div>
  <div id="status"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const BASE = location.pathname.replace(/\/live\/?$/, '');          // même origine que l'API : pas de CORS
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, running = false, paused = false, busy = false, interim = '', lastSent = '', timer = null, inflight = false;
const cache = {};

const num = v => (v === '' || isNaN(Number(v))) ? null : Number(v);
const status = t => { $('status').textContent = t; };
function hdr() { const t = $('token').value.trim(); return {'Content-Type': 'application/json', ...(t ? {Authorization: 'Bearer ' + t} : {})}; }
async function api(path, body) {
  const r = await fetch(BASE + path, {method: 'POST', headers: hdr(), body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 160));
  return r;
}
function fill(ul, items, cls) {                                   // textContent seulement : jamais de HTML venant du serveur
  ul.replaceChildren(...items.map(s => { const li = document.createElement('li'); li.textContent = s; if (cls) li.className = cls; return li; }));
}

// ---- étape 1 : sous-titres anglais pendant que le fermier parle
async function translate(text) {
  if (!$('subs').checked) return '';
  if (cache[text] !== undefined) return cache[text];
  const j = await (await api('/captions', {text})).json();
  return (cache[text] = j.en || '');
}
function scheduleInterim() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (inflight || interim.length < 4 || interim === lastSent) return;
    inflight = true; lastSent = interim; const sent = interim;
    try { const en = await translate(sent); if (interim === sent) $('en').textContent = en || '...'; }
    catch (e) { status('Sous-titres : ' + e.message); }
    finally { inflight = false; if (interim && interim !== lastSent) scheduleInterim(); }
  }, 500);
}

// ---- étape 2 : question -> cœur (parcelle, rotation, impact) ; étape 3 : réponse parlée (ElevenLabs côté serveur)
async function ask(text) {
  busy = true; status('Réflexion...');
  try {
    const r = await (await api('/message', {
      text, lang: $('lang').value, parcelle_id: num($('parcelle').value),
      previous_crop: $('prev').value.trim() || null, n_rate: num($('nrate').value)})).json();
    $('answer').textContent = r.text || '-';
    fill($('figures'), r.figures || []); fill($('gaps'), r.needs_info || [], 'warn');
    status(`Mode : ${r.mode || '-'} | Intention : ${r.intent}`);
    if ($('voice').checked && r.text) await speak(r.text);
  } catch (e) { status('Erreur : ' + e.message); }
  finally { busy = false; resume(); }
}
async function speak(text) {
  try {
    const blob = await (await api('/speak', {text})).blob();
    pauseRec();                                                   // le micro ne doit pas entendre la réponse
    const a = new Audio(URL.createObjectURL(blob));
    await new Promise(res => { a.onended = res; a.onerror = res; a.play().catch(res); });
  } catch (e) { status('Voix : ' + e.message); }
}

function pauseRec() { if (rec && running) { paused = true; try { rec.stop(); } catch (e) {} } }
function resume() { if (rec && running && paused) { paused = false; try { rec.start(); } catch (e) {} } }

function setup() {
  if (!SR) { $('en').textContent = 'Ce navigateur ne gère pas la reconnaissance vocale. Utilise Chrome ou Edge.'; $('go').disabled = true; return; }
  rec = new SR(); rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let tmp = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) onFinal(r[0].transcript.trim()); else tmp += r[0].transcript;
    }
    interim = tmp.trim(); if (interim) { $('ar').textContent = interim; scheduleInterim(); }
  };
  rec.onerror = e => { if (e.error !== 'no-speech') status('Micro : ' + e.error + (e.error === 'not-allowed' ? ' (autorise le micro)' : '')); };
  rec.onend = () => { if (running && !paused) { try { rec.start(); } catch (e) {} } };
}
async function onFinal(text) {
  if (!text) return;
  interim = ''; $('ar').textContent = text;
  translate(text).then(en => { $('en').textContent = en || '...'; }).catch(() => {});
  if (!busy) ask(text);
}
$('go').onclick = () => {
  if (!rec) return;
  if (!running) { rec.lang = $('sr').value; running = true; paused = false; $('go').textContent = 'Stop'; status('Écoute (' + rec.lang + ')'); try { rec.start(); } catch (e) {} }
  else { running = false; $('go').textContent = 'Start'; status('Arrêté'); rec.stop(); }
};
$('clr').onclick = () => { interim = ''; $('ar').textContent = ''; $('en').textContent = 'Appuie sur Start et parle'; $('answer').textContent = '-'; fill($('figures'), []); fill($('gaps'), []); };
$('token').value = sessionStorage.getItem('af_token') || '';
$('token').onchange = () => sessionStorage.setItem('af_token', $('token').value);
setup();
</script></body></html>
